<div class="d-flex flex-column mt-2 align-items-center vh-100">

  <div>
    <h1>Add task</h1>
  </div>

  <div class="d-flex flex-column mt-2 h-75 w-25 align-items-center">
    <form [formGroup]="taskForm">
      <input type="text" class="form-control h-50" formControlName="name">
      <input type="text" class="form-control h-50" formControlName="description">
      <input type="text" class="form-control h-50" formControlName="date">
      <div>
        <button class="btn btn-primary mt-2" (click)="add()">Add</button>
      </div>
    </form>

  </div>
  <div class="container mt-4">
    <h3 class="mb-4 text-primary border-bottom pb-2">Your Tasks</h3>

    <div class="row g-3">
      @for (task of taskList; track task.task_name) {
        <div class="col-md-4 col-sm-6">
          <div class="card h-100 shadow-sm border-dark">
            <div class="card-body">
              <h5 class="card-title text-uppercase fw-bold">{{ task.task_name }}</h5>
              <p class="card-text text-muted">{{ task.task_description }}</p>
            </div>
            <div class="card-footer bg-transparent border-top-0">
              <span class="badge bg-info text-dark">
                <i class="bi bi-calendar-event me-1"></i> {{ task.task_date }}
              </span>
            </div>
          </div>
        </div>
      } @empty {
        <div class="col-12 text-center text-muted mt-5">
          <p>No tasks found. Start by adding one!</p>
        </div>
      }
    </div>
  </div>



</div>
